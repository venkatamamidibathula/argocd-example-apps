apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  labels:
    app: my-app
    env: dev
data:
  # Key-value pairs (strings)
  APP_NAME: "my-app"
  LOG_LEVEL: "info"
  ENABLE_FEATURE_X: "true"

  # Multi-line file-like content
  config.json: |
    {
      "database": {
        "host": "db.default.svc.cluster.local",
        "port": 5432,
        "name": "mydb"
      },
      "cache": {
        "enabled": true,
        "ttlSeconds": 300
      }
    }

  # Another file example (e.g., properties)
  application.properties: |
    server.port=8080
    management.endpoints.web.exposure.include=health,info
